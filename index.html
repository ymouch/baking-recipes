<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>烘焙食譜</title>
<style>
  :root { color-scheme: light; --bg:#faf6ef; --card:#fff; --ink:#3b2f26; --soft:#85756a; --accent:#b5652f; --line:#e8dfd2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:26px; margin:0 0 14px; }
  h2 { font-size:18px; margin:26px 0 8px; }
  a { color:var(--accent); text-decoration:none; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:6px 14px; font:inherit; font-size:15px; cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:16px; }
  .card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; color:inherit; }
  .card img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; }
  .card div { padding:10px 12px; }
  .card b { display:block; line-height:1.35; }
  .soft { color:var(--soft); font-size:14px; }
  .hero { display:block; width:100%; max-height:380px; object-fit:cover; border-radius:12px; margin:12px 0; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  input, select { font:inherit; color:inherit; background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) 124px 52px; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .amount { display:flex; align-items:center; gap:4px; }
  .amount input { width:84px; text-align:right; }
  .pct { text-align:right; color:var(--soft); font-size:14px; }
  .mold { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .mold input { width:76px; text-align:right; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .reset { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  ol { padding-left:22px; margin:0; }
  li { margin:6px 0; }
</style>
</head>
<body>
<main id="app"></main>
<script>document.write('<script src="recipes.js?t=' + Date.now() + '"><\/script>');</script>
<script>
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const fmt = n => String(n < 10 ? Math.round(n * 10) / 10 : Math.round(n));
const round1 = n => Math.round(n * 10) / 10;
const area = (shape, size) => shape === "round" ? Math.PI * size * size / 4 : size * size;
const unitOf = ing => ing.unit || "克";
const filter = { cat: "全部", tag: "" };

function renderList() {
  const cats = ["全部", "蛋糕", "餅乾", "麵包", "塔派", "其他"];
  const tags = [...new Set(RECIPES.flatMap(r => r.tags || []))];
  const shown = RECIPES.filter(r => (filter.cat === "全部" || r.category === filter.cat) && (!filter.tag || (r.tags || []).includes(filter.tag)));
  app.innerHTML = `<h1>烘焙食譜</h1>
    <div class="chips">${cats.map(c => `<button class="chip ${c === filter.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="chips">${tags.map(t => `<button class="chip ${t === filter.tag ? "on" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <div class="grid">${shown.map(r => `<a class="card" href="#${esc(r.id)}">
      ${r.photo ? `<img src="${esc(r.photo)}" alt="${esc(r.name)}" loading="lazy">` : ""}
      <div><b>${esc(r.name)}</b><span class="soft">${esc(r.category)}</span></div></a>`).join("") || `<p class="soft">這個分類還沒有食譜。</p>`}</div>`;
  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { filter.cat = b.dataset.cat; renderList(); });
  app.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => { filter.tag = filter.tag === b.dataset.tag ? "" : b.dataset.tag; renderList(); });
}

function renderRecipe(r) {
  const flour = r.ingredients.filter(i => i.flour).reduce((sum, i) => sum + i.g, 0);
  const pct = i => flour && ["克", "毫升"].includes(unitOf(i)) ? fmt(i.g / flour * 100) + "%" : "";
  app.innerHTML = `<a href="#">← 所有食譜</a>
    <h1 style="margin-top:8px">${esc(r.name)}</h1>
    <div class="soft">${[r.category, ...(r.tags || [])].map(esc).join("・")}</div>
    ${r.photo ? `<img class="hero" src="${esc(r.photo)}" alt="${esc(r.name)}">` : ""}
    ${r.mold ? `<h2>模具</h2><div class="box mold">
      <select id="shape"><option value="round">圓形</option><option value="square">方形</option></select>
      <input id="size" type="number" inputmode="decimal" min="0" step="any" aria-label="模具大小"> 吋
      <span class="soft">原食譜 ${r.mold.shape === "round" ? "圓形" : "方形"} ${esc(r.mold.size)} 吋</span></div>` : ""}
    <h2>食材</h2>
    <div class="box">
      ${r.ingredients.map((ing, n) => `<div class="row">
        <div>${esc(ing.name)}${ing.piece ? `<div class="soft" data-piece="${n}"></div>` : ""}</div>
        <div class="amount"><input data-i="${n}" type="number" inputmode="decimal" min="0" step="any" aria-label="${esc(ing.name)}">${esc(unitOf(ing))}</div>
        <div class="pct">${pct(ing)}</div></div>`).join("")}
      <div class="bar"><span class="soft">目前是原食譜的 <b id="factor"></b> 倍</span><button class="reset" id="reset">回到原食譜</button></div>
    </div>
    ${flour ? `<p class="soft">百分比是烘焙百分比，麵粉為 100%，不隨份量改變；液體以 1 毫升約 1 克計。</p>` : ""}
    <h2>步驟</h2><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    ${r.note ? `<h2>備註</h2><p>${esc(r.note)}</p>` : ""}`;

  let factor = 1;
  const inputs = [...app.querySelectorAll("[data-i]")];
  const shape = document.getElementById("shape"), size = document.getElementById("size");
  const baseArea = r.mold && area(r.mold.shape, r.mold.size);

  function update(skip) {
    inputs.forEach(el => { if (el !== skip) el.value = fmt(r.ingredients[el.dataset.i].g * factor); });
    app.querySelectorAll("[data-piece]").forEach(el => {
      const ing = r.ingredients[el.dataset.piece];
      el.textContent = `約 ${fmt(ing.g * factor / ing.piece.g)} ${ing.piece.unit}`;
    });
    document.getElementById("factor").textContent = Math.round(factor * 100) / 100;
    if (size && size !== skip) size.value = round1(Math.sqrt(factor * baseArea / area(shape.value, 1)));
  }
  inputs.forEach(el => el.oninput = () => {
    const v = parseFloat(el.value);
    if (v > 0) { factor = v / r.ingredients[el.dataset.i].g; update(el); }
  });
  if (size) {
    shape.value = r.mold.shape;
    const fromMold = () => {
      const s = parseFloat(size.value);
      if (s > 0) { factor = area(shape.value, s) / baseArea; update(size); }
    };
    size.oninput = fromMold;
    shape.onchange = fromMold;
  }
  document.getElementById("reset").onclick = () => {
    factor = 1;
    if (shape) shape.value = r.mold.shape;
    update();
  };
  update();
  scrollTo(0, 0);
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const r = RECIPES.find(x => x.id === id);
  r ? renderRecipe(r) : renderList();
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
